# This template contains all of the possible sections and their default values

# Note that all fields that take a lint level have these possible values:
# * deny - An error will be produced and the check will fail
# * warn - A warning will be produced, but the check will not fail
# * allow - No warning or error will be produced, though in some cases a note
# will be

# The values provided in this template are the default values that will be used
# when any section or field is not specified in your own configuration

# Root options

# The graph table configures how the dependency graph is constructed and thus
# which crates the checks are performed against
[graph]
# If 1 or more target triples (and optionally, target_features) are specified,
# only the specified targets will be checked when running `cargo deny check`.
# This means, if a particular package is only ever used as a target specific
# dependency, such as, for example, the `nix` crate only being used via the
# `target_family = "unix"` configuration, that only having windows targets in
# this list would mean the nix crate, as well as any of its exclusive
# dependencies not shared by any other crates, would be ignored, as the target
# list here is effectively saying which targets you are building for.
targets = [
    # The triple can be any string, but only the target triples built in to
    # rustc (as of 1.40) can be checked against actual config expressions
    #"x86_64-unknown-linux-musl",
    # You can also specify which target_features you promise are enabled for a
    # particular target. target_features are currently not validated against
    # the actual valid features supported by the target architecture.
    #{ triple = "wasm32-unknown-unknown", features = ["atomics"] },
]
# When creating the dependency graph used as the source of truth when checks are
# executed, this field can be used to prune crates from the graph, removing them
# from the view of cargo-deny. This is an extremely heavy hammer, as if a crate
# is pruned from the graph, all of its dependencies will also be pruned unless
# they are connected to another crate in the graph that hasn't been pruned,
# so it should be used with care. The identifiers are [Package ID Specifications]
# (https://doc.rust-lang.org/cargo/reference/pkgid-spec.html)
#exclude = []
# If true, metadata will be collected with `--all-features`. Note that this can't
# be toggled off if true, if you want to conditionally enable `--all-features` it
# is recommended to pass `--all-features` on the cmd line instead
all-features = false
# If true, metadata will be collected with `--no-default-features`. The same
# caveat with `all-features` applies
no-default-features = false
# If set, these feature will be enabled when collecting metadata. If `--features`
# is specified on the cmd line they will take precedence over this option.
#features = []

# The output table provides options for how/if diagnostics are outputted
[output]
# When outputting inclusion graphs in diagnostics that include features, this
# option can be used to specify the depth at which feature edges will be added.
# This option is included since the graphs can be quite large and the addition
# of features from the crate(s) to all of the graph roots can be far too verbose.
# This option can be overridden via `--feature-depth` on the cmd line
feature-depth = 1

# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
# The path where the advisory databases are cloned/fetched into
#db-path = "$CARGO_HOME/advisory-dbs"
# The url(s) of the advisory databases to use
#db-urls = ["https://github.com/rustsec/advisory-db"]
# A list of advisory IDs to ignore. Note that ignored advisories will still
# output a note when they are encountered.
ignore = [
    # Unmaintained transitive dependencies from libp2p and leptos
    # These are not actual security vulnerabilities, just maintenance status warnings
    { id = "RUSTSEC-2024-0384", reason = "instant - unmaintained (from libp2p)" },
    { id = "RUSTSEC-2024-0436", reason = "paste - unmaintained (from leptos/netlink)" },

    # --- Phase 4 Waivers (2025-12) ---
    # RUSTSEC-2025-0057: fxhash (via sled)
    # Constraint-based mitigation: sled keys are high-entropy UUID/BLAKE3 values only.
    { id = "RUSTSEC-2025-0057", reason = "Mitigated: sled keys are crypto-hashes/UUIDs only" },

    # RUSTSEC-2025-0134: rustls-pemfile (via reqwest)
    # Trusted control plane: only admin-provisioned PEMs are parsed locally.
    { id = "RUSTSEC-2025-0134", reason = "Mitigated: Trusted control plane / local PEM inputs only" },

    # --- Phase C RDMA toolchain (bindgen) warnings ---
    # ansi_term (RUSTSEC-2021-0139) and atty (RUSTSEC-2021-0145, RUSTSEC-2024-0375)
    # are pulled in by bindgen 0.59 (rdma-sys build-time) and do not ship in runtime artifacts.
    { id = "RUSTSEC-2021-0139", reason = "bindgen build-time dep via rdma-sys; no runtime exposure" },
    { id = "RUSTSEC-2021-0145", reason = "bindgen build-time dep via rdma-sys; no runtime exposure" },
    { id = "RUSTSEC-2024-0375", reason = "bindgen build-time dep via rdma-sys; no runtime exposure" },
]
# If this is true, then cargo deny will use the git executable to fetch advisory database.
# If this is false, then it uses a built-in git library.
# Setting this to true can be helpful if you have special authentication requirements that cargo-deny does not support.
# See Git Authentication for more information about setting up git authentication.
#git-fetch-with-cli = true

# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",      # ISC License (OSI approved, FSF Free/Libre) - used by ring, rustls-webpki, simple_asn1, untrusted
    "MIT",
    "MPL-2.0",  # Mozilla Public License 2.0 (OSI approved, FSF Free/Libre, weak copyleft) - used by webpki-roots
    "Unicode-3.0",
]
confidence-threshold = 0.85

[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["NCSA"]

[[licenses.clarify]]
name = "rdma-sys"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x57d00757 }]

# rdma-sys is a build-time dependency (bindgen) without a declared SPDX expression.
# We scope an explicit exception to avoid blocking on the missing metadata.
[[licenses.exceptions]]
name = "rdma-sys"
allow = ["Apache-2.0", "MIT", "BSD-3-Clause"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
    # libp2p ecosystem transitive dependencies
    { crate = "base64@0.21.7", reason = "libp2p-gossipsub transitive pin" },
    { crate = "unsigned-varint@0.7.2", reason = "multistream-select transitive pin" },
    { crate = "yamux@0.12.1", reason = "multistream-select transitive pin" },

    # Older ecosystem versions
    { crate = "bitflags@1.3.2", reason = "transitive pin from various deps" },
    { crate = "getrandom@0.2.16", reason = "rand ecosystem transitive pin" },
    { crate = "hashbrown@0.14.5", reason = "std collections compatibility" },
    { crate = "heck@0.4.1", reason = "proc-macro transitive pin" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix transitive pin" },
    { crate = "rustix@0.38.44", reason = "system interface transitive pin" },
    { crate = "socket2@0.4.10", reason = "tokio-uring/sled compatibility" },
    { crate = "socket2@0.5.10", reason = "tokio/mio compatibility" },
    { crate = "socket2@0.6.1", reason = "hyper-util/tokio compatibility" },
    { crate = "syn@1.0.109", reason = "proc-macro v1 compatibility" },

    # parking_lot ecosystem split (sled vs tokio/libp2p stacks)
    { crate = "parking_lot@0.11.2", reason = "sled pin" },
    { crate = "parking_lot_core@0.8.6", reason = "sled pin" },
    { crate = "parking_lot@0.12.5", reason = "tokio/libp2p stack" },
    { crate = "parking_lot_core@0.9.12", reason = "tokio/libp2p stack" },
    { crate = "redox_syscall@0.2.16", reason = "parking_lot_core 0.8.x pin" },
    { crate = "redox_syscall@0.5.18", reason = "parking_lot_core 0.9.x pin" },

    # rand ecosystem
    { crate = "rand@0.8.5", reason = "ecosystem compatibility" },
    { crate = "rand_chacha@0.3.1", reason = "rand 0.8 compatibility" },
    { crate = "rand_core@0.6.4", reason = "rand 0.8 compatibility" },

    # thiserror v1 (many crates still use v1)
    { crate = "thiserror@1.0.69", reason = "ecosystem compatibility" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1.0 proc-macro" },

    # Windows platform dependencies
    { crate = "windows-sys@0.48.0", reason = "legacy windows support" },
    { crate = "windows-sys@0.52.0", reason = "socket2 0.5 compatibility" },
    { crate = "windows-sys@0.60.2", reason = "tokio transitive pin (clap stack)" },
    { crate = "windows-sys@0.61.2", reason = "tokio transitive pin (mio stack)" },
    { crate = "windows-core@0.53.0", reason = "libp2p/if-watch pin; incompatible with chrono stack" },
    { crate = "windows-core@0.62.2", reason = "chrono/iana-time-zone pin; incompatible with libp2p windows bindings" },
    { crate = "windows-result@0.1.2", reason = "windows 0.53 transitive pin" },
    { crate = "windows-result@0.4.1", reason = "windows 0.62 transitive pin" },
    { crate = "windows-targets@0.48.5", reason = "windows-sys 0.48 support" },
    { crate = "windows-targets@0.52.6", reason = "windows-sys 0.52 support" },
    { crate = "windows_aarch64_gnullvm@0.48.5", reason = "windows-targets 0.48 support" },
    { crate = "windows_aarch64_gnullvm@0.52.6", reason = "windows-targets 0.52 support" },
    { crate = "windows_aarch64_msvc@0.48.5", reason = "windows-targets 0.48 support" },
    { crate = "windows_aarch64_msvc@0.52.6", reason = "windows-targets 0.52 support" },
    { crate = "windows_i686_gnu@0.48.5", reason = "windows-targets 0.48 support" },
    { crate = "windows_i686_gnu@0.52.6", reason = "windows-targets 0.52 support" },
    { crate = "windows_i686_gnullvm@0.52.6", reason = "windows-targets 0.52 support" },
    { crate = "windows_i686_msvc@0.48.5", reason = "windows-targets 0.48 support" },
    { crate = "windows_i686_msvc@0.52.6", reason = "windows-targets 0.52 support" },
    { crate = "windows_x86_64_gnu@0.48.5", reason = "windows-targets 0.48 support" },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "windows-targets 0.52 support" },
    { crate = "windows_x86_64_gnullvm@0.48.5", reason = "windows-targets 0.48 support" },
    { crate = "windows_x86_64_gnullvm@0.52.6", reason = "windows-targets 0.52 support" },
    { crate = "windows_x86_64_msvc@0.48.5", reason = "windows-targets 0.48 support" },
    { crate = "windows_x86_64_msvc@0.52.6", reason = "windows-targets 0.52 support" },

    # Tower/Axum compatibility
    { crate = "tower@0.4.13", reason = "protocol-s3 compatibility" },
    { crate = "tower@0.5.2", reason = "axum 0.7 stack" },

    # Build-time duplicate stacks pulled by bindgen (rdma-sys)
    { crate = "clap@2.34.0", reason = "bindgen build-time dependency (rdma-sys); coexists with clap 4 runtime" },
    { crate = "hermit-abi@0.1.19", reason = "bindgen/atty build-time dependency (rdma-sys); coexists with hermit-abi 0.5" },
    { crate = "strsim@0.8.0", reason = "bindgen/clap2 build-time dependency (rdma-sys); coexists with strsim 0.11" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
