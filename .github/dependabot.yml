version: 2

# Version updates wait out a cooldown, so a release that turns out to be
# compromised or broken is usually yanked before it gets here. Dependabot
# security updates, when they're enabled in the repository settings, don't
# wait.

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    cooldown:
      default-days: 7
    # Not "security": most bumps are routine. Add it by hand to a PR that
    # fixes an advisory, so the label stays a filter for real security work.
    labels: [dependencies]
    commit-message:
      prefix: deps
    open-pull-requests-limit: 10
    groups:
      crypto-stack:
        patterns:
          - 'aes*'
          - 'cipher'
          - 'xts-mode'
          - 'poly1305'
          - 'subtle'
          - 'zeroize'
          - 'blake3'
          - 'sha1'
          - 'sha2'
          - 'md-5'
          - 'hmac'
          - 'cpufeatures'
      infra:
        patterns:
          - 'tokio'
          - 'tracing*'
          - 'axum'
          - 'tower*'
          - 'futures'
      serde-stack:
        patterns:
          - 'serde*'
      compression:
        patterns:
          - 'lz4*'
          - 'zstd'
    ignore:
      - dependency-name: windows-sys
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    cooldown:
      default-days: 7
    labels: [ci, dependencies]
    commit-message:
      prefix: ci
    # One pull request for every action bump; the actions are pinned by commit.
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
    cooldown:
      default-days: 7
    labels: [build, dependencies]
    commit-message:
      prefix: docker
    # The FROM lines are pinned by digest; these pull requests move the
    # digests of rust:1-bookworm and debian:bookworm-slim.
    groups:
      base-images:
        patterns: ['*']
