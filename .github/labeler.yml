# Labels for actions/labeler (see workflows/labeler.yml). Each key is an
# existing repository label; a pull request gets it when it changes a file
# matching one of the globs.

documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

build:
  - changed-files:
      - any-glob-to-any-file:
          - 'Cargo.toml'
          - 'crates/*/Cargo.toml'
          - 'Dockerfile'
          - '.dockerignore'
          - '.cargo/**'
          - 'deny.toml'

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['Cargo.lock']

core:
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/common/**'
          - 'crates/capsule-registry/**'
          - 'crates/pipeline/**'
          - 'crates/storage/**'
          - 'crates/nvram-sim/**'
          - 'crates/compression/**'
          - 'crates/dedup/**'

encryption:
  - changed-files:
      - any-glob-to-any-file: ['crates/encryption/**']

protocol-s3:
  - changed-files:
      - any-glob-to-any-file: ['crates/protocol-s3/**']

cli:
  - changed-files:
      - any-glob-to-any-file: ['crates/spacectl/**']

testing:
  - changed-files:
      - any-glob-to-any-file: ['crates/*/tests/**', 'crates/*/benches/**']
