# Auto-label PRs based on file paths
# Used by the labeler workflow to route reviews and track changes.
# Labels are applied based on changed file paths to route reviews.

# ── Subsystem labels ─────────────────────────────────────────────

core:
  - changed-files:
      - any-glob-to-any-file:
          - crates/common/**
          - crates/capsule-registry/**
          - crates/pipeline/**
          - crates/storage/**
          - crates/nvram-sim/**

encryption:
  - changed-files:
      - any-glob-to-any-file:
          - crates/encryption/**

data-services:
  - changed-files:
      - any-glob-to-any-file:
          - crates/compression/**
          - crates/dedup/**

block-storage:
  - changed-files:
      - any-glob-to-any-file:
          - crates/foundry/**
          - crates/tiering/**

protocol-s3:
  - changed-files:
      - any-glob-to-any-file:
          - crates/protocol-s3/**

protocol-nfs:
  - changed-files:
      - any-glob-to-any-file:
          - crates/protocol-nfs/**

protocol-block:
  - changed-files:
      - any-glob-to-any-file:
          - crates/protocol-block/**
          - crates/protocol-nvme/**

protocol-fuse:
  - changed-files:
      - any-glob-to-any-file:
          - crates/protocol-fuse/**
          - crates/protocol-csi/**

federation:
  - changed-files:
      - any-glob-to-any-file:
          - crates/federation/**
          - crates/scaling/**
          - crates/mesh-core/**
          - crates/gossip-layer/**
          - crates/podms-orchestrator/**

compute:
  - changed-files:
      - any-glob-to-any-file:
          - crates/transform-engine/**
          - crates/layout-engine/**

cli:
  - changed-files:
      - any-glob-to-any-file:
          - crates/spacectl/**

web-ui:
  - changed-files:
      - any-glob-to-any-file:
          - crates/web-interface/**

# ── Cross-cutting labels ─────────────────────────────────────────

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "**/*.md"
          - NOTICE

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - deny.toml

build:
  - changed-files:
      - any-glob-to-any-file:
          - Cargo.toml
          - Cargo.lock
          - xtask/**
          - "**/build.rs"
          - "**/Cargo.toml"

security:
  - changed-files:
      - any-glob-to-any-file:
          - crates/encryption/**
          - SECURITY.md
          - docs/security/**
          - deny.toml

testing:
  - changed-files:
      - any-glob-to-any-file:
          - fuzz/**
          - "**/tests/**"
          - "**/*test*"

vendor:
  - changed-files:
      - any-glob-to-any-file:
          - vendor/**

simulation:
  - changed-files:
      - any-glob-to-any-file:
          - crates/sim-nvram/**
          - crates/sim-nvmeof/**
          - crates/sim-other/**
