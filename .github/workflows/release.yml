name: Release

# Pushing a tag vX.Y.Z (the workspace version in Cargo.toml) runs the whole CI
# suite on the tagged commit, builds spacectl for each platform, and
# publishes a GitHub release with the archives, a SHA256SUMS file, and a build
# provenance attestation for each archive.
#
# The builds are in release-build.yml. ci.yml runs them as a dry run on a pull
# request that changes how a release is built, as part of `Build and test`, so
# a broken release is found before a tag needs it.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

# A tag's run never gets cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check-tag:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag names the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$TAG" = "v$version" ] \
            || { echo "::error file=Cargo.toml::tag $TAG doesn't match the workspace version $version"; exit 1; }

  ci:
    name: CI
    permissions:
      contents: read
    # Not the newer $/ form: actionlint 1.7.12 rejects it.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  build:
    name: Build
    permissions:
      contents: read
    # Not the newer $/ form: actionlint 1.7.12 rejects it.
    uses: ./.github/workflows/release-build.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ github.ref_name }}

  publish:
    name: Publish the release
    needs: [check-tag, ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write # store the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: spacectl-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/spacectl-*

      # The same attestations as a release asset, for offline verification
      # (gh attestation verify --bundle) and for Scorecard's Signed-Releases.
      - name: Attach the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: cp -- "$BUNDLE" "dist/spacectl-${TAG}.sigstore.json"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md) for what changed. Verify a download with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`." \
            "${prerelease[@]}"
