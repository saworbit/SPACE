name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.toml license
        run: |
          grep -q 'license = "MIT OR Apache-2.0"' Cargo.toml || { echo "Incorrect license field"; exit 1; }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace -- --test-threads=2

  msrv:
    name: Build on rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in step with rust-version in Cargo.toml and the Dockerfile image.
      - uses: dtolnay/rust-toolchain@1.89

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --locked
