name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.toml license
        run: |
          grep -q 'license = "BUSL-1.1"' Cargo.toml || { echo "Incorrect license field"; exit 1; }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy on the io_uring backend
        run: cargo clippy -p storage --features uring --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace -- --test-threads=2

  msrv:
    name: Build on rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in step with rust-version in Cargo.toml and the Dockerfile image.
      - uses: dtolnay/rust-toolchain@1.89

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --locked

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      # Ignored advisories live in .cargo/audit.toml and deny.toml, each with a reason.
      - name: cargo audit
        run: cargo audit --deny warnings

      - name: cargo deny
        run: cargo deny check
