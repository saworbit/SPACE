name: MSRV Check

on:
  push:
    branches: [main]  # Only on main to save CI minutes
  schedule:
    # Run weekly on Monday at 2am UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:  # Allow manual trigger

# Cancel outdated runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Minimum Supported Rust Version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check with MSRV
        run: cargo check --workspace --all-targets

      - name: Test with MSRV
        run: cargo test --workspace -- --test-threads=2
