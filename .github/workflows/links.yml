name: Links

# Checks the links in the Markdown files. Not a required check: an external
# site being down shouldn't block a merge. The weekly run catches links that
# rot without a commit.

on:
  pull_request:
    paths:
      - '**.md'
      - '.lycheeignore'
      - '.github/workflows/links.yml'
  schedule:
    - cron: '7 7 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ignored URLs are in .lycheeignore.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude-path target
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
