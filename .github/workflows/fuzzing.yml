name: Continuous Fuzzing

on:
  push:
    branches: [main]
    paths:
      - 'crates/encryption/**'
      - 'crates/layout-engine/**'
      - 'fuzz/**'
  pull_request:
    branches: [main]
    paths:
      - 'crates/encryption/**'
      - 'crates/layout-engine/**'
      - 'fuzz/**'
  schedule:
    - cron: '0 2 * * *' # Daily deep scan

# Cancel outdated runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz Policy Engine
        run: cargo fuzz run policy_fuzz --features fuzzing -- -runs=5000000 -max_total_time=300

      - name: Fuzz Encryption Roundtrip
        run: cargo fuzz run encrypt_roundtrip --features fuzzing -- -runs=5000000 -max_total_time=300

      - name: Archive Crash Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-artifacts
          path: fuzz/artifacts/
