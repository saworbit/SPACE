name: Needs Rebase

# Label PRs that have merge conflicts with the base branch.
# More visible than GitHub's small "This branch has conflicts" notice --
# the label shows up in PR lists and filters.

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  label:
    name: Check for merge conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: "needs-rebase"
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          commentOnDirty: "This PR has merge conflicts. Please rebase on the latest `main`."
          commentOnClean: "Merge conflicts resolved -- thanks!"
