name: Security Audit

on:
  push:
    branches:
      - main  # Only on main to save CI minutes (xtask audit is expensive)
  schedule:
    # Run weekly on Tuesday at 3am UTC
    - cron: '0 3 * * 2'
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Rust toolchain specification (e.g. stable, stable 2 weeks ago)"
        required: true
        default: "stable"

# Cancel outdated runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEFAULT_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve toolchain
        id: toolchain
        shell: bash
        run: |
          input_toolchain="${{ github.event.inputs.toolchain }}"
          if [[ -z "$input_toolchain" ]]; then
            input_toolchain="$DEFAULT_TOOLCHAIN"
          fi
          echo "toolchain=$input_toolchain" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install security tooling
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
          cargo install cargo-bloat --locked

      - name: Run xtask audit
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.toolchain }}
        run: cargo xtask audit
