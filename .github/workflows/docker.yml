name: Docker

# Lints the Dockerfile, builds the image and runs it. Nothing is pushed to a
# registry. Runs when the Dockerfile or the toolchain it depends on changes,
# and weekly, since the base images move without a commit here.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker.yml'
  schedule:
    - cron: '53 7 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: docker build
        run: docker build --pull --tag space-core:ci .

      # The image runs as a non-root user, so check it can write a store in
      # its working directory, on a fresh volume, and read it back.
      - name: Smoke test
        run: |
          docker run --rm space-core:ci --version
          docker volume create space-ci > /dev/null
          id=$(echo 'hello from the image' | docker run --rm -i -v space-ci:/data space-core:ci create -q -)
          docker run --rm -v space-ci:/data space-core:ci read "$id" | grep -qx 'hello from the image'

      # As PID 1, serve-s3 must handle docker stop's SIGTERM itself: stop well
      # inside the 10 s timeout, with exit status 0, not a SIGKILL.
      - name: docker stop
        run: |
          docker run -d --name space-stop -v space-ci:/data space-core:ci serve-s3 > /dev/null
          for _ in $(seq 60); do
            docker logs space-stop 2>&1 | grep -q ' listening ' && break
            sleep 1
          done
          docker logs space-stop 2>&1 | grep -q ' listening ' \
            || { docker logs space-stop; echo "::error::serve-s3 didn't start"; exit 1; }
          start=$(date +%s)
          docker stop space-stop > /dev/null
          took=$(( $(date +%s) - start ))
          status=$(docker inspect --format '{{.State.ExitCode}}' space-stop)
          docker logs space-stop 2>&1 | tail -n 3
          docker rm space-stop > /dev/null
          docker volume rm space-ci > /dev/null
          [ "$status" = 0 ] || { echo "::error::serve-s3 exited with $status after docker stop"; exit 1; }
          [ "$took" -lt 8 ] || { echo "::error::docker stop took ${took}s"; exit 1; }
