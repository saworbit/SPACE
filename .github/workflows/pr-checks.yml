name: PR Checks

# Consolidated fast checks for pull requests
# Combines: ci, quality, and license-check to reduce parallel runs

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'

# Cancel outdated runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.toml license
        run: |
          grep -q 'license = "MIT OR Apache-2.0"' Cargo.toml || { echo "Incorrect license field"; exit 1; }

      - name: Test workspace
        run: cargo test --workspace -- --test-threads=2

  quality:
    name: Spell Check & Link Check
    runs-on: ubuntu-latest
    # Only run on PRs (not every push to main to save minutes)
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Spell check
        uses: crate-ci/typos@master
        with:
          files: .
        continue-on-error: true  # Don't fail on typos, just warn

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './**/*.md' './**/*.html'
          fail: false  # Don't fail on broken links, just warn
