# Cargo audit configuration
# See: https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example
#
# CI runs `cargo audit --deny warnings`. Keep this list to advisories the
# current dependency tree actually triggers, each with its reason, and keep it
# in step with [advisories] in deny.toml.

[advisories]
ignore = [
    "RUSTSEC-2025-0141",  # bincode 1.3.3 unmaintained: it's the encoding of
                          # space.db records, so moving off it is a format
                          # migration. 3.x is a protest release.
    "RUSTSEC-2025-0057",  # fxhash unmaintained, via sled 0.34. Not a
                          # vulnerability; sled keys are UUIDs and BLAKE3 hashes.
    "RUSTSEC-2024-0384",  # instant unmaintained, via parking_lot 0.11 in
                          # sled 0.34. Not a vulnerability.
]
