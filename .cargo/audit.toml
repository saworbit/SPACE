# Cargo audit configuration
# See: https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example

[advisories]
# Ignore unmaintained warnings for transitive dependencies from libp2p and leptos
# These are not actual security vulnerabilities, just maintenance status warnings
ignore = [
    "RUSTSEC-2024-0384",  # instant - unmaintained (from libp2p)
    "RUSTSEC-2024-0436",  # paste - unmaintained (from leptos/netlink)
    "RUSTSEC-2024-0370",  # proc-macro-error - unmaintained (from leptos)
    "RUSTSEC-2025-0057",  # fxhash - unmaintained (transitive via sled; no maintained replacement yet)
    "RUSTSEC-2025-0134",  # rustls-pemfile - unmaintained; constrained to trusted PEM inputs only
    # bindgen build-time deps via rdma-sys (Phase C tooling)
    "RUSTSEC-2021-0139",  # ansi_term unmaintained (build-time only)
    "RUSTSEC-2021-0145",  # atty potential unaligned read (build-time only)
    "RUSTSEC-2024-0375",  # atty unmaintained (build-time only)
]
