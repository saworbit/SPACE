[package]
name = "protocol-s3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
# Exposes the request body parsers to the fuzz targets in fuzz/ (#243).
fuzzing = []

[dependencies]
common = { path = "../common" }
capsule-registry = { path = "../capsule-registry" }
nvram-sim = { path = "../nvram-sim" }

# HTTP server
axum = { workspace = true, features = ["http2", "multipart"] } # 2025-11-03 sw: Tier1 HTTP surface per docs/dependency-security.md
tokio = { workspace = true }
tower = { version = "^0.5.3", features = ["util"] } # 2025-11-03 sw: aligns with axum 0.7 require
tower-http = { workspace = true, features = ["cors", "trace"] } # 2025-11-03 sw: HTTP middleware review logged
tokio-util = { version = "^0.7.11", features = ["io"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Checking a PUT body against the digests its headers give (#196)
md-5 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

# Utilities
bytes = { version = "^1.10.1" } # 2025-11-03 sw: pinned to release used in audit
httpdate = "1.0"
futures = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
test-support = { path = "../test-support" }
futures = { workspace = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["stream"] }
http-body-util = "0.1"
proptest = "^1.8.0" # 2026-11-15 sw: same as capsule-registry's, for the index rebuild proptest (#139)
encryption = { path = "../encryption" }
