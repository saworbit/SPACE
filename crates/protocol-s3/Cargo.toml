[package]
name = "protocol-s3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
default = []
modular_pipeline = ["capsule-registry/modular_pipeline"]
advanced-security = [
    "common/advanced-security",
    "capsule-registry/advanced-security",
    "nvram-sim/advanced-security",
]

[dependencies]
common = { path = "../common" }
capsule-registry = { path = "../capsule-registry" }
nvram-sim = { path = "../nvram-sim" }

# HTTP server
axum = { version = "^0.8.7", features = ["http2", "multipart"] } # 2025-11-03 sw: Tier1 HTTP surface per docs/dependency-security.md
tokio = { workspace = true }
tower = { version = "^0.5.2", features = ["util"] } # 2025-11-03 sw: aligns with axum 0.7 require
tower-http = { version = "^0.6.7", features = ["cors", "trace"] } # 2025-11-03 sw: HTTP middleware review logged
tokio-util = { version = "^0.7.11", features = ["io"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Utilities
bytes = { version = "^1.10.1" } # 2025-11-03 sw: pinned to release used in audit
httpdate = "1.0"
futures = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "blocking", "rustls-tls", "stream"] }
http-body-util = "0.1"
