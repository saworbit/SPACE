[package]
name = "layout-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
default = ["cpu"]
cpu = []
zns = []
ml = ["tch"]
pq = ["sha3"]

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
sha3 = { version = "0.10.8", optional = true }
tch = { version = "0.15", optional = true, features = ["download-libtorch"] }
common = { path = "../common" }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "layout_bench"
harness = false
