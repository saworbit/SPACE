syntax = "proto3";

package space.raft.v1;

// RaftService handles Raft consensus protocol messages between nodes.
// This is separate from FederationService which handles data plane operations.
service RaftService {
  // Send a Raft protocol message to a peer.
  // Messages include: votes, heartbeats, append entries, snapshots, etc.
  rpc SendMessage(RaftMessageRequest) returns (RaftMessageResponse);
}

// Request containing a Raft protocol message.
message RaftMessageRequest {
  // Serialized raft::eraftpb::Message using prost encoding.
  // This contains all Raft protocol fields: from, to, term, msg_type, entries, etc.
  bytes message = 1;
}

// Response to a Raft message.
message RaftMessageResponse {
  // Whether the message was successfully received and processed.
  bool ok = 1;
  // Error message if ok is false.
  string error = 2;
}

// Commands for cluster state machine operations
message Command {
  oneof payload {
    RegisterNode register_node = 1;
    CreateVolume create_volume = 2;
    DeleteVolume delete_volume = 3;
    MoveReplica move_replica = 4;
  }
}

message RegisterNode {
  uint64 node_id = 1;
  string address = 2;
  uint64 capacity_bytes = 3;
}

message CreateVolume {
  string volume_id = 1;
  uint64 size_bytes = 2;
  uint32 replication_factor = 3;
  // Phase 9.5: The exact nodes decided by the Leader's Scheduler
  // This list is baked into the command by the Leader to ensure
  // deterministic replay on all followers
  repeated uint64 replicas = 4;
  // Phase 9.6: Optional source snapshot to hydrate from
  optional string source_capsule_id = 5;
}

message DeleteVolume {
  string volume_id = 1;
}

message MoveReplica {
  string volume_id = 1;
  uint64 from_node = 2;
  uint64 to_node = 3;
}
