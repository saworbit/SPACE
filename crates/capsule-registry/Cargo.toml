[package]
name = "capsule-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
default = []

[dependencies]
common = { path = "../common" }
nvram-sim = { path = "../nvram-sim" }
encryption = { path = "../encryption" }  # NEW: Phase 3 encryption support
compression = { path = "../compression" }
dedup = { path = "../dedup" }
storage = { path = "../storage" }
uuid = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
lz4 = { workspace = true }
zstd = { workspace = true }
blake3 = { workspace = true }
subtle = { workspace = true }
bytes = { workspace = true }
# The index of the capsule journal, space.db (#244). Pinned like the other
# on-disk formats; 4.1 is the newest on the workspace rust-version (1.89).
redb = "=4.1.0" # 2026-11-16 sw: one file, ACID multi-table writes, no background threads
pipeline = { path = "../pipeline" }
async-trait = "0.1"
tokio-util = { version = "^0.7.11", features = ["io"] }
async-stream = "0.3"

[dev-dependencies]
test-support = { path = "../test-support" }
tracing-test = { workspace = true }
futures = { workspace = true }
criterion = "0.5"
tokio = { workspace = true, features = ["full"] }
proptest = "^1.8.0"

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "runtime_overhead"
harness = false

[[bench]]
name = "end_to_end"
harness = false
