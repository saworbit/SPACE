[package]
name = "capsule-registry"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
default = []
pipeline_async = ["dep:num_cpus"]
modular_pipeline = ["dep:pipeline"]
phase5 = ["modular_pipeline", "pipeline/phase5"]
advanced-security = ["common/advanced-security", "nvram-sim/advanced-security"]
podms = ["pipeline_async", "common/podms", "dep:scaling"]
phase4 = [
    "podms",
    "scaling/phase4",
]

[dependencies]
common = { path = "../common" }
nvram-sim = { path = "../nvram-sim" }
encryption = { path = "../encryption" }  # NEW: Phase 3 encryption support
compression = { path = "../compression" }
dedup = { path = "../dedup" }
storage = { path = "../storage" }
mesh-core = { path = "../mesh-core" }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
num_cpus = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
lz4 = { workspace = true }
zstd = { workspace = true }
blake3 = { workspace = true }
subtle = { workspace = true }
bytes = { workspace = true }
sled = "0.34"
pipeline = { path = "../pipeline", optional = true }
scaling = { path = "../scaling", optional = true }
sim-nvram = { path = "../sim-nvram", version = "0.1.0" }  # For simulation mode support
async-trait = "0.1"
tokio-util = { version = "^0.7.11", features = ["io"] }
async-stream = "0.3"

# Phase 3: distributed consensus (Raft)
openraft = { version = "0.9.21", features = ["serde", "storage-v2"] }
tonic = { version = "0.12.3", features = ["transport"] }
prost = "0.13.5"

[dev-dependencies]
tracing-test = { workspace = true }
futures = { workspace = true }
criterion = "0.5"
tokio = { workspace = true, features = ["full"] }

[build-dependencies]
tonic-build = "0.12.3"
protoc-bin-vendored = "3.2.0"

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "runtime_overhead"
harness = false
