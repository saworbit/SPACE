[package]
name = "protocol-fuse"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
default = []
phase4 = ["common/podms", "scaling/phase4"]
kernel_fuse = ["dep:fuser"]

[dependencies]
anyhow = { workspace = true }
capsule-registry = { path = "../capsule-registry", features = ["phase4"] }
common = { path = "../common" }
scaling = { path = "../scaling", features = ["phase4"] }
tracing = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "rt", "rt-multi-thread"] }
libc = "0.2"
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
fuser = { version = "0.12", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
encryption = { path = "../encryption" }
nvram-sim = { path = "../nvram-sim" }
tempfile = "3"
