[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/compression",
    "crates/dedup",
    "crates/encryption",
    "crates/storage",
    "crates/nvram-sim",
    "crates/pipeline",
    "crates/capsule-registry",
    "crates/protocol-s3",
    "crates/spacectl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Shane Wall <shane@adaptive-storage.dev>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
uuid = { version = "^1.18.1", features = ["v4", "serde"] }
anyhow = { version = "^1.0.100" }
thiserror = { version = "^2.0.17" }
tokio = { version = "^1.48.0", features = ["full"] }
futures = { version = "^0.3.31" }
tracing = { version = "^0.1.41", features = ["std", "attributes"] }
tracing-subscriber = { version = "^0.3.20", features = ["env-filter", "fmt", "json"] }
clap = { version = "^4.5.49", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145" }
blake3 = { version = "=1.8.3" }
lz4 = { version = "=1.28.1" }
zstd = { version = "=0.13.3" }
zeroize = { version = "=1.8.2" }
aes = { version = "=0.8.4" }
cipher = { version = "=0.4.4" }
xts-mode = { version = "=0.5.1" }
poly1305 = { version = "=0.8.0" }
subtle = { version = "=2.6.1" }
hmac = { version = "=0.12.1" }
sha2 = { version = "=0.10.9" }
hex = { version = "=0.4.3" }
cpufeatures = { version = "=0.3.1" }
lru = { version = "=0.19.0" }
bincode = { version = "=1.3.3" }
num_cpus = { version = "^1.17.0" }
serde_yaml = { version = "0.9" }
tracing-test = { version = "^0.2.5" }
axum = { version = "^0.7.9", features = ["macros", "multipart"] }
tower-http = { version = "^0.6.8", features = ["cors", "trace"] }
bytes = { version = "^1.10.1" }
prometheus = { version = "=0.14.0", features = ["process"] }

[workspace.metadata.space.allowed-features]
"capsule-registry" = []
"spacectl" = []
"encryption" = ["std"]
