[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/compression",
    "crates/dedup",
    "crates/encryption",
    "crates/storage",
    "crates/nvram-sim",
    "crates/pipeline",
    "crates/capsule-registry",
    "crates/protocol-s3",
    "crates/spacectl",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Highest rust-version among locked dependencies; CI checks the build on it.
rust-version = "1.89"
authors = ["Shane Wall <shane@adaptive-storage.dev>"]
license = "BUSL-1.1"

[workspace.dependencies]
uuid = { version = "^1.18.1", features = ["v4", "serde"] }
anyhow = { version = "^1.0.100" }
thiserror = { version = "^2.0.17" }
tokio = { version = "^1.48.0", features = ["full"] }
futures = { version = "^0.3.31" }
tracing = { version = "^0.1.41", features = ["std", "attributes"] }
tracing-subscriber = { version = "^0.3.20", features = ["env-filter", "fmt", "json"] }
clap = { version = "^4.5.49", features = ["derive"] }
clap_complete = { version = "^4.6.0" } # 2026-11-15 sw: clap's own completion generator, for spacectl completions (#169)
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
blake3 = { version = "=1.8.7" }
lz4 = { version = "=1.28.1" }
zstd = { version = "=0.14.3" }
zeroize = { version = "=1.9.1" }
aes = { version = "=0.9.4" }
cipher = { version = "=0.5.2" }
xts-mode = { version = "=0.6.0" }
poly1305 = { version = "=0.9.1" }
subtle = { version = "=2.6.1" }
hmac = { version = "=0.13.0" }
sha2 = { version = "=0.11.1" }
md-5 = { version = "=0.11.0" }
sha1 = { version = "=0.11.0" }
base64 = { version = "=0.23.1" }
hex = { version = "=0.4.3" }
cpufeatures = { version = "=0.3.1" }
lru = { version = "=0.19.0" }
serde_norway = { version = "=0.9.42" }
tracing-test = { version = "^0.2.5" }
axum = { version = "^0.8.9", features = ["macros", "multipart"] }
tower-http = { version = "^0.7.1", features = ["cors", "trace"] }
bytes = { version = "^1.10.1" }

[workspace.metadata.space.allowed-features]
"capsule-registry" = []
"spacectl" = []
"encryption" = ["std"]

# Smaller dev and test builds. Each new mix of features and dependencies gets its own
# copy of every test binary in target/, so the size of one copy adds up quickly.
# Line tables keep file and line numbers in panics and backtraces. For full debugger
# info in workspace crates, build with CARGO_PROFILE_DEV_DEBUG=true.
# Incremental compilation is off: on Windows it made rebuilds slower and target/ twice
# as big. CI already sets CARGO_INCREMENTAL=0. Set CARGO_INCREMENTAL=1 to turn it back on.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Dependencies keep their symbol names in backtraces but carry no line tables.
[profile.dev.package."*"]
debug = false
